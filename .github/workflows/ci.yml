name: Lumo checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Изолированная база для тестов; это не база опубликованного сайта.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lumo_test
          POSTGRES_PASSWORD: test_only_local_ci
          POSTGRES_DB: lumo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumo_test -d lumo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lumo_test:test_only_local_ci@127.0.0.1:5432/lumo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
        env:
          LUMO_TEST_SERVE_SITE: "1"
